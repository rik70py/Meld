name: Release PC Desktop (MSI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop MSI Version (numeric: e.g. 1.0.2 or 1.0.3)'
        required: true
        default: '1.0.2'
      tag:
        description: 'Release Tag (leave empty to use v<version>, or specify e.g. v0.9.2 to join Android release)'
        required: false
        default: ''
      draft:
        description: 'Create as draft release (if creating a new release)'
        type: boolean
        default: true

jobs:
  build-and-release-desktop:
    name: Build & Release Windows Desktop MSI
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch libVLC (bundled into the installer)
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlc-extract -Force
          $src = "vlc-extract\vlc-$v"
          $dst = "desktop\resources\windows-x64\vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src\libvlc.dll","$src\libvlccore.dll" $dst
          Copy-Item "$src\plugins" "$dst\plugins" -Recurse
          Copy-Item "$src\COPYING.txt" "desktop\resources\windows-x64\VLC-COPYING.txt"

      - name: Ensure WiX Toolset 3.x is installed
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX is already on PATH"
          } elseif (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe") {
            echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added WiX v3.11 to PATH"
          } elseif (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe") {
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added WiX v3.14 to PATH"
          } else {
            Write-Host "Installing WiX Toolset via Chocolatey..."
            choco install wixtoolset -y --no-progress
            $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($wixDir -and (Test-Path "$($wixDir.FullName)\bin\candle.exe")) {
              echo "$($wixDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added $($wixDir.FullName)\bin to PATH"
            }
          }

      - name: Package Windows Desktop Distributable & MSI
        shell: pwsh
        run: |
          $rawVer = "${{ inputs.version }}"
          $msiVer = $rawVer.TrimStart('v').Trim()
          Write-Host "Packaging desktop with MSI version: $msiVer"
          ./gradlew :desktop:createDistributable :desktop:packageMsi "-PdesktopVersion=$msiVer"

      - name: Verify libVLC is inside the package
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop\build\compose\binaries\main -Recurse -Filter libvlc.dll -ErrorAction SilentlyContinue
          if (-not $f) { throw "libvlc.dll not found in packaged app distribution" }
          Write-Host "Verified libvlc.dll is bundled at: $($f.FullName)"
          $msi = Get-ChildItem desktop\build\compose\binaries\main\msi -Filter *.msi -ErrorAction SilentlyContinue
          if (-not $msi) { throw "MSI installer was not generated" }
          Write-Host "Verified MSI generated: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MB)"

      - name: Stage MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item desktop\build\compose\binaries\main\msi\*.msi out\Meld-Desktop-Windows.msi
          Write-Host "Staged output MSI to out\Meld-Desktop-Windows.msi"

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Meld-Desktop-Windows
          path: out/Meld-Desktop-Windows.msi

      - name: Publish to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rawVer = "${{ inputs.version }}"
          $msiVer = $rawVer.TrimStart('v').Trim()
          $rawTag = "${{ inputs.tag }}".Trim()
          $tag = if ($rawTag) { $rawTag } else { "v$msiVer" }
          $isDraft = "${{ inputs.draft }}"

          Write-Host "Target release tag: $tag"
          Write-Host "Attempting to upload Meld-Desktop-Windows.msi to release $tag..."
          $uploadOutput = & gh release upload $tag out\Meld-Desktop-Windows.msi --clobber 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Successfully attached Meld-Desktop-Windows.msi to existing release $tag."
          } else {
            Write-Host "Release $tag not found or cannot be modified directly ($uploadOutput). Creating release $tag..."
            if ($isDraft -eq "true") {
              gh release create $tag out\Meld-Desktop-Windows.msi --title "$tag" --notes "Release $tag for Meld PC (Windows Desktop)" --draft
            } else {
              gh release create $tag out\Meld-Desktop-Windows.msi --title "$tag" --notes "Release $tag for Meld PC (Windows Desktop)"
            }
          }
          Write-Host "GitHub release step completed successfully."
